version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-rag-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - qdrant
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: multimodal-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Milvus (Fallback - disabled by default)
  # Uncomment to enable Milvus fallback testing
  # milvus:
  #   image: milvusdb/milvus:latest
  #   container_name: multimodal-rag-milvus
  #   restart: "no"
  #   ports:
  #     - "19530:19530"
  #     - "9091:9091"
  #   environment:
  #     ETCD_ENDPOINTS: etcd:2379
  #     MINIO_ADDRESS: minio:9000
  #   volumes:
  #     - milvus_data:/var/lib/milvus
  #   depends_on:
  #     - etcd
  #     - minio
  #   networks:
  #     - rag-network

  # etcd:
  #   image: quay.io/coreos/etcd:latest
  #   container_name: multimodal-rag-etcd
  #   environment:
  #     - ETCD_AUTO_COMPACTION_MODE=revision
  #     - ETCD_AUTO_COMPACTION_RETENTION=1000
  #     - ETCD_QUOTA_BACKEND_BYTES=4294967296
  #   volumes:
  #     - etcd_data:/etcd
  #   networks:
  #     - rag-network

  # minio:
  #   image: minio/minio:latest
  #   container_name: multimodal-rag-minio
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   volumes:
  #     - minio_data:/minio_data
  #   command: minio server /minio_data
  #   networks:
  #     - rag-network

  mongo:
    image: mongo:6
    container_name: multimodal-rag-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=multimodal_rag
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: multimodal-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: multimodal-rag-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - rag-network

  grafana:
    image: grafana/grafana:latest
    container_name: multimodal-rag-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - rag-network
    depends_on:
      - prometheus

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-rag-celery-worker
    env_file: .env
    command: celery -A src.workers.celery_app worker --loglevel=info
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - mongo
      - qdrant
    restart: unless-stopped
    networks:
      - rag-network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimodal-rag-flower
    env_file: .env
    command: celery -A src.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  qdrant_storage:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  # milvus_data:
  # etcd_data:
  # minio_data:
